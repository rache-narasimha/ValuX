<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>General Property Valuation</title>
    <link rel="icon" href="/assets/images/valux-monogram.png" type="image/png" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link rel="stylesheet" href="/assets/css/workflow.css" />
    <link rel="stylesheet" href="/assets/css/institution-valuation-offline.css" />
    <script src="/assets/js/core/appearance.js"></script>
    <script src="/assets/js/core/form-tab-order.js"></script>
    <style>
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="report-header-tools"><a class="report-home-logo" href="/" aria-label="Return to work dashboard">SLN</a><button class="appearance-toggle" type="button" data-appearance-toggle></button></div>
        <h1>General property valuation</h1>
        <p>
          Residential, commercial and industrial property valuation workflow.
        </p>
      </div>
      <div id="status" aria-live="polite">Draft</div>
    </header>
    <main>
      <aside><nav id="nav"></nav></aside>
      <section class="workspace">
        <form id="valuation-form">
          <div id="groups"></div>
          <footer>
            <button type="button" class="secondary" id="previous">
              Previous</button
            ><span id="progress"></span
            ><button type="button" class="secondary" id="next">
              Next section</button
            ><button type="button" class="preview-button" id="preview-report">
              Preview report</button
            ><button
              type="submit"
              class="primary"
              id="generate-docx"
              data-format="docx"
              disabled
            >
              Generate DOCX</button
            ><button
              type="submit"
              class="primary"
              id="generate-pdf"
              data-format="pdf"
              disabled
            >
              Download PDF copy
            </button>
          </footer>
        </form>
      </section>
    </main>
    <div
      class="processing"
      id="processing"
      hidden
      role="status"
      aria-live="polite"
    >
      <div class="processing-card">
        <strong id="processing-title">Processing report</strong>
        <div class="loading-track" aria-hidden="true">
          <div class="loading-bar"></div>
        </div>
        <span id="processing-stage">Please wait…</span>
      </div>
    </div>
    <div class="modal" id="preview-modal" hidden>
      <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="preview-title"
      >
        <div class="modal-head">
          <div>
            <h2 id="preview-title">Word print-layout preview</h2>
            <p>
              This PDF is rendered from the exact DOCX that will be downloaded.
            </p>
          </div>
          <button
            type="button"
            class="modal-close"
            id="close-preview"
            aria-label="Close preview"
          >
            ×
          </button>
        </div>
        <iframe
          id="preview-frame"
          title="Generated valuation report preview"
        ></iframe>
      </div>
    </div>
    <script src="/assets/js/components/report-calculator.js"></script>
    <script src="/assets/js/core/numeric-entry.js"></script>
    <script src="/assets/js/core/business-api.js"></script>
    <script src="/assets/js/core/report-data.js"></script>
    <script src="/assets/js/core/time.js"></script>
    <script src="/assets/js/core/app-shell.js"></script>
    <script src="/assets/js/components/account-chrome.js"></script>
    <script src="/assets/js/core/institutions.js"></script>
    <script src="/assets/js/core/shared.js"></script>
    <script src="/assets/js/components/valuation-writing.js"></script>
    <script src="/assets/js/core/valuation-example-values.js"></script>
    <script src="/assets/js/components/valuation-examples.js"></script>
    <script src="/assets/js/core/valuation-calculations.js"></script>
    <script src="/assets/js/core/workflow-access.js"></script>
    <script src="/assets/js/core/task-store.js"></script>
    <script src="/assets/js/components/report-readonly.js"></script>
    <script src="/assets/js/components/workflow-ui.js"></script>
    <script src="/assets/js/pages/institution-valuation-offline.js"></script>
    <script src="/assets/js/components/estimation-processing.js"></script>
    <script src="/assets/js/pages/retrospective-valuation.js"></script>
    <script src="/assets/js/pages/general.js"></script>
    <script src="/assets/js/components/task-context.js"></script>
    <script src="/assets/js/components/report-layout.js"></script>
  </body>
</html>
